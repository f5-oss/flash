<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FLASH V - تطبيق التواصل الاحترافي</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body, html { width: 100%; height: 100%; overflow: hidden; background: #000; color: #fff; transition: all 0.5s ease; }
        
        /* الثيمات */
        body.dark-theme { background: linear-gradient(135deg, #0f0f23 0%, #1a0a2e 100%); }
        body.light-theme { background: linear-gradient(135deg, #f5f5f5 0%, #e0e0e0 100%); color: #333; }
        body.blue-theme { background: linear-gradient(135deg, #001a4d 0%, #003d99 100%); }
        body.purple-theme { background: linear-gradient(135deg, #2d1b4e 0%, #1a0a2e 100%); }
        
        .overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(45deg, rgba(0,0,0,0.7), rgba(26,26,46,0.5));
            z-index: 1; pointer-events: none;
            transition: all 0.5s ease;
        }

        body.ghost-mode .overlay {
            background: linear-gradient(45deg, rgba(10,10,30,0.9), rgba(26,10,46,0.8));
            box-shadow: inset 0 0 60px rgba(100, 50, 200, 0.3);
        }

        /* القائمة الجانبية */
        .sidebar {
            position: fixed;
            right: -300px;
            top: 0;
            width: 300px;
            height: 100%;
            background: rgba(22, 22, 37, 0.98);
            backdrop-filter: blur(15px);
            z-index: 999;
            border-left: 1px solid rgba(255,255,255,0.1);
            transition: right 0.3s ease;
            overflow-y: auto;
            padding: 20px 0;
        }

        .sidebar.active {
            right: 0;
        }

        .sidebar-header {
            padding: 0 20px;
            margin-bottom: 20px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding-bottom: 20px;
        }

        .sidebar-menu {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .sidebar-item {
            padding: 12px 20px;
            cursor: pointer;
            transition: all 0.3s ease;
            border-left: 3px solid transparent;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .sidebar-item:hover {
            background: rgba(255,255,255,0.1);
            border-left-color: #e94560;
        }

        .sidebar-item.active {
            background: rgba(233, 69, 96, 0.2);
            border-left-color: #e94560;
            color: #e94560;
        }

        /* المحتوى الرئيسي */
        .main-content {
            position: relative;
            z-index: 3;
            height: calc(100% - 80px);
            overflow-y: auto;
            padding: 20px;
        }

        /* شاشة البدء السريع */
        .welcome-screen {
            display: none;
            text-align: center;
            padding: 40px 20px;
            animation: slideIn 0.5s ease;
        }

        .welcome-screen.active {
            display: block;
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .welcome-logo {
            font-size: 80px;
            margin-bottom: 20px;
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-20px); }
        }

        .welcome-title {
            font-size: 32px;
            font-weight: bold;
            margin-bottom: 10px;
            background: linear-gradient(135deg, #e94560, #ff6b7a);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .welcome-subtitle {
            font-size: 16px;
            color: #888;
            margin-bottom: 40px;
        }

        .welcome-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 40px;
        }

        .welcome-btn {
            padding: 20px;
            background: linear-gradient(135deg, rgba(233, 69, 96, 0.3), rgba(255, 107, 122, 0.3));
            border: 2px solid rgba(233, 69, 96, 0.5);
            color: #fff;
            border-radius: 15px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            transition: all 0.3s ease;
        }

        .welcome-btn:hover {
            background: linear-gradient(135deg, rgba(233, 69, 96, 0.6), rgba(255, 107, 122, 0.6));
            transform: translateY(-5px);
        }

        /* لوحة المعلومات */
        .dashboard {
            display: none;
        }

        .dashboard.active {
            display: block;
        }

        .dashboard-header {
            margin-bottom: 30px;
        }

        .dashboard-header h2 {
            font-size: 28px;
            margin-bottom: 10px;
        }

        .dashboard-header p {
            font-size: 14px;
            color: #888;
        }

        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 30px;
        }

        .dashboard-card {
            background: linear-gradient(135deg, rgba(233, 69, 96, 0.1), rgba(0, 217, 255, 0.1));
            padding: 25px;
            border-radius: 15px;
            border: 1px solid rgba(255,255,255,0.1);
            text-align: center;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .dashboard-card:hover {
            transform: translateY(-10px);
            border: 1px solid rgba(233, 69, 96, 0.5);
            box-shadow: 0 10px 30px rgba(233, 69, 96, 0.2);
        }

        .dashboard-card-icon {
            font-size: 40px;
            margin-bottom: 10px;
        }

        .dashboard-card-number {
            font-size: 28px;
            font-weight: bold;
            color: #e94560;
            margin-bottom: 5px;
        }

        .dashboard-card-label {
            font-size: 12px;
            color: #888;
        }

        /* الشاشات الأخرى */
        .screen {
            display: none;
            animation: slideIn 0.5s ease;
        }

        .screen.active {
            display: block;
        }

        /* شاشة الدردشة المحسنة */
        .chat-screen-wrapper {
            display: flex;
            flex-direction: column;
            height: 100%;
            gap: 15px;
        }

        .chat-header {
            background: rgba(255,255,255,0.05);
            border-radius: 15px;
            padding: 15px;
            border: 1px solid rgba(255,255,255,0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .chat-header-info {
            text-align: right;
        }

        .chat-header-name {
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 3px;
        }

        .chat-header-status {
            font-size: 12px;
            color: #888;
        }

        .call-buttons {
            display: flex;
            gap: 8px;
            position: relative;
        }

        .call-btn {
            padding: 8px 12px;
            background: rgba(233, 69, 96, 0.3);
            border: 1px solid rgba(233, 69, 96, 0.5);
            color: #ff6b7a;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .call-btn:hover {
            background: rgba(233, 69, 96, 0.6);
            transform: translateY(-2px);
        }

        /* --- (rest of original styles kept unchanged) --- */

    </style>

    <!-- Injected styles for icon animations and hiding sidebar toggle -->
    <style>
      :root{ --icon-color: #6aa0d6; }
      /* hide the floating sidebar toggle (three-lines/hamburger) visually */
      .sidebar-toggle{ display:none !important; }

      /* Animated icon class */
      .icon-animated{
        transition: transform 800ms ease, color 800ms ease, box-shadow 800ms ease;
        color: var(--icon-color) !important;
        text-shadow: 0 6px 18px rgba(0,0,0,0.25);
      }

      @keyframes floaty {
        0%{ transform: translateY(0) rotate(-1deg); }
        50%{ transform: translateY(-8px) rotate(1deg); }
        100%{ transform: translateY(0) rotate(-1deg); }
      }

      @media (prefers-reduced-motion: no-preference){
        .icon-animated.animated{ animation: floaty 6s ease-in-out infinite; }
      }
    </style>

</head>
<body class="dark-theme normal-mode">

    <div class="overlay"></div>

    <!-- مؤشر وضع الشبح -->
    <div class="ghost-indicator" id="ghostIndicator">
        <div style="width: 8px; height: 8px; background: #00ff88; border-radius: 50%; animation: pulse 1s infinite;"></div>
        <span>👻 وضع الشبح</span>
    </div>

    <!-- زر فتح القائمة الجانبية -->
    <button class="sidebar-toggle" onclick="toggleSidebar()">☰</button>

    <!-- القائمة الجانبية -->
    <div class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <h3 style="margin-bottom: 10px;">FLASH v</h3>
            <p style="font-size: 12px; color: #888;">التطبيق الاحترافي للتواصل</p>
        </div>
        <div class="sidebar-menu">
            <div class="sidebar-item active" onclick="switchToScreen('welcome', 'Welcome')">🚀 البدء السريع</div>
            <div class="sidebar-item" onclick="switchToScreen('dashboard', 'Dashboard')">📊 لوحة المعلومات</div>
            <div class="sidebar-item" onclick="switchToScreen('chat', 'Chat')">💬 الدردشة</div>
            <div class="sidebar-item" onclick="switchToScreen('reminders', 'SmartReminders')">🔔 التنبيهات الذكية</div>
            <div class="sidebar-item" onclick="switchToScreen('profile', 'Profile')">👤 الملف الشخصي</div>
            <div class="sidebar-item" onclick="switchToScreen('search', 'Search')">🔍 البحث</div>
            <div class="sidebar-item" onclick="switchToScreen('notifications', 'Notifications')">📢 الإشعارات</div>
            <div class="sidebar-item" onclick="switchToScreen('activities', 'Activities')">🎯 الأنشطة</div>
            <div class="sidebar-item" onclick="switchToScreen('achievements', 'Achievements')">🏆 الإنجازات</div>
        </div>
    </div>

    <!-- (rest of original HTML kept as-is) -->

    <!-- Injected JS: icon animations, color cycle, settings integration -->
    <script>
    (function(){
      const palettes = [
        ['#6aa0d6','#8fc3e8','#d9eefc','#4f86c6'],
        ['#6fbf97','#a8e6cf','#dbf5e7','#5bb07e'],
        ['#b49fd9','#d6c9f5','#efe9ff','#9a7fc2'],
        ['#f2a98e','#ffd6c2','#fff1ed','#f07a5f'],
        ['#7bd1c6','#bff3ea','#e9fffb','#4fb39a']
      ];

      function pickColor(){
        const p = palettes[Math.floor(Math.random()*palettes.length)];
        return p[Math.floor(Math.random()*p.length)];
      }

      function hexToRgba(hex, a=1){
        const h=hex.replace('#',''); const n=parseInt(h,16);
        return `rgba(${(n>>16)&255},${(n>>8)&255},${n&255},${a})`;
      }

      const STORAGE_KEY = 'flash_ui_prefs_v1';
      const DEFAULTS = { animationEnabled:true, colorCycleEnabled:true, colorIntervalMs:60000 };
      function loadPrefs(){ try{ const r=localStorage.getItem(STORAGE_KEY); return r?Object.assign({},DEFAULTS,JSON.parse(r)):DEFAULTS;}catch(e){return DEFAULTS;} }
      function savePrefs(p){ try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(p)); }catch(e){}
      }

      function applyColor(color){
        document.documentElement.style.setProperty('--icon-color', color);
        const els = document.querySelectorAll('.nav-item > div:first-child, .dashboard-card-icon, .activity-icon, .message-avatar, .sidebar-item');
        els.forEach(el=>{
          el.classList.add('icon-animated');
          el.style.color = color;
          el.style.boxShadow = `0 14px 36px ${hexToRgba(color,0.10)}`;
        });
      }

      function setAnimation(enabled){
        const els = document.querySelectorAll('.icon-animated');
        els.forEach(el=>{ if(enabled) el.classList.add('animated'); else el.classList.remove('animated'); });
      }

      document.addEventListener('DOMContentLoaded', ()=>{
        const prefs = loadPrefs();
        const prefersReduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        const animOn = prefs.animationEnabled && !prefersReduced;

        // initial apply
        applyColor(pickColor());
        setAnimation(animOn);

        // start color cycle
        let timer = null;
        function startCycle(){ if(timer) clearInterval(timer); if(prefs.colorCycleEnabled){ timer=setInterval(()=>applyColor(pickColor()), prefs.colorIntervalMs); } }
        startCycle();
        window._flash_ui = { applyColor, setAnimation, prefs, savePrefs };

        // connect to settings controls if exist
        const toggleAnim = document.getElementById('toggleAnimation');
        const toggleColor = document.getElementById('toggleColorCycle');
        if(toggleAnim){ toggleAnim.checked = !!prefs.animationEnabled; toggleAnim.addEventListener('change', e=>{ prefs.animationEnabled = e.target.checked; savePrefs(prefs); setAnimation(prefs.animationEnabled && !prefersReduced); }); }
        if(toggleColor){ toggleColor.checked = !!prefs.colorCycleEnabled; toggleColor.addEventListener('change', e=>{ prefs.colorCycleEnabled = e.target.checked; savePrefs(prefs); startCycle(); }); }

      });
    })();
    </script>

</body>
</html>
